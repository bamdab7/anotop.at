# Publica una versión nueva al subir una etiqueta como «v1.1.0».
# Crea el .exe (un solo archivo), lo prueba y sube Anotop.at.exe a las Releases,
# con las novedades de CHANGELOG.md. De ahí descarga la app las actualizaciones.
# Pasos para publicar: docs/PUBLICAR.md.
name: Publicar versión

on:
  push:
    tags: ["v*"]

permissions:
  contents: write  # para crear la release

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt

      - name: Comprobar que la etiqueta coincide con la versión del código
        shell: python
        run: |
          import os, sys
          sys.path.insert(0, ".")
          from anotador import __version__
          tag = os.environ["GITHUB_REF_NAME"].lstrip("vV")
          if tag != __version__:
              sys.exit(f"La etiqueta v{tag} no coincide con __version__ = {__version__} "
                       "(anotador/__init__.py). Cambia una de las dos.")

      # La descripción de la Release (y lo que ve la gente en «Buscar actualizaciones»)
      # es el apartado de esta versión en CHANGELOG.md. Si no existe, no se publica.
      - name: Sacar las novedades de CHANGELOG.md
        run: python tools/release_notes.py $env:GITHUB_REF_NAME > "$env:RUNNER_TEMP\notas.md"

      - name: Tests
        run: python -m pytest -q

      - name: Crear el .exe
        run: python tools/build_exe.py

      - name: Probar el .exe abriendo un PDF (sin pantalla)
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:ANOTADOR_SETTINGS_DIR = "$env:RUNNER_TEMP\prefs"
          $pdf = "$env:RUNNER_TEMP\prueba.pdf"
          $shot = "$env:RUNNER_TEMP\captura.png"
          python -c "import pymupdf, sys; d = pymupdf.open(); d.new_page().insert_text((50, 80), 'Hola'); d.save(sys.argv[1])" $pdf
          $p = Start-Process dist\Anotop.at.exe -ArgumentList "`"$pdf`"", "--screenshot", "`"$shot`"" -PassThru -Wait
          if ($p.ExitCode -ne 0 -or -not (Test-Path $shot)) { throw "El .exe no abrió el PDF (código $($p.ExitCode))" }

      # Hasta la 1.1.0 la app se llamaba «Anotador PDF» y su actualizador busca
      # AnotadorPDF.exe. Con esta copia, esas versiones también se actualizan.
      - name: Copia con el nombre antiguo
        run: Copy-Item dist\Anotop.at.exe dist\AnotadorPDF.exe

      - name: Publicar la release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Anotop.at.exe
            dist/AnotadorPDF.exe
          body_path: ${{ runner.temp }}/notas.md
